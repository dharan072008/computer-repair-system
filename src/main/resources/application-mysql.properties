# -------------------------------------------------------------
# MySQL Database Configuration (Target: MySQL Server 8 on Port 3306)
# Database Name: computer_repair_db
# -------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/computer_repair_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:k1i2s3h4o5r6}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# SQL Logging (Helpful for OOPJ viva demonstration)
logging.level.org.hibernate.SQL=DEBUG
